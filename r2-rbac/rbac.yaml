apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-sa
  namespace: dvc-probe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: probe-role
  namespace: dvc-probe
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probe-rb
  namespace: dvc-probe
subjects:
- kind: ServiceAccount
  name: probe-sa
  namespace: dvc-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: probe-role
