apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: probe-logreader
  namespace: dvc-probe
spec:
  selector:
    matchLabels:
      app: probe-logreader
  template:
    metadata:
      labels:
        app: probe-logreader
    spec:
      containers:
      - name: reader
        image: busybox:1.36
        command: ["sh", "-c", "ls /host/var/log; sleep 3600"]
        volumeMounts:
        - name: varlog
          mountPath: /host/var/log
          readOnly: true
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
