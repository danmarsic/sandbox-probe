apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-nginx
  namespace: dvc-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-nginx
  template:
    metadata:
      labels:
        app: probe-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
